name: BatchOperation_test_on_main
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.Snowflake.BatchOperation/**'
  workflow_dispatch:

jobs:
  build:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/linux_build_main.yml@main
    with:
      workdir: Frends.Snowflake.BatchOperation
      dotnet_version: 8.0.x
      strict_analyzers: true
      env_var_name_1: CONNECTION_STRING
      env_var_name_2: PRIVATE_KEY_BASE64
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      env_var_value_1: ${{ secrets.SNOWFLAKE_CONNECTIONSTRING }}
      env_var_value_2: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}
